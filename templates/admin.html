<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>지도자 모니터링 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>선수단 체중 및 훈련 현황</h2>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger">로그아웃</a>
    </div>

    <table class="table table-bordered bg-white shadow-sm">
        <thead class="table-primary text-center">
            <tr>
                <th>선수명</th>
                <th>목표 체중</th>
                <th>최근 측정 체중</th>
                <th>최근 측정일</th>
                <th>상세보기</th>
            </tr>
        </thead>
        <tbody class="text-center">
            {% for data in athlete_data %}
            <tr>
                <td>{{ data.info.name }}</td>
                <td>{{ data.info.target_weight or '-' }} kg</td>
                <td>{{ data.latest_record.weight if data.latest_record else '-' }} kg</td>
                <td>{{ data.latest_record.date if data.latest_record else '-' }}</td>
                <td>
                    <button class="btn btn-sm btn-info text-white" data-bs-toggle="modal" data-bs-target="#modal-{{ data.info.id }}">
                        훈련일지 확인
                    </button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
