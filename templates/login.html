<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로그인 - 체중 및 훈련일지 관리</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    /* 배경 이미지 + 어두운 오버레이 필터(글자 식별용) */
    background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1517838277536-f5f99be501cd?q=80&w=1920');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    height: 100vh;
    margin: 0;
  }
</style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="card shadow p-4" style="width: 360px; background-color: rgba(255, 255, 255, 0.95); border-radius: 12px;">
<h3 class="text-center mb-4">선수단 로그인</h3>
{% with messages = get_flashed_messages() %}
{% if messages %}
<div class="alert alert-danger p-2 fs-6">{{ messages[0] }}</div>
{% endif %}
{% endwith %}
<form action="{{ url_for('login') }}" method="POST">
<div class="mb-3">
<label class="form-label">아이디</label>
<input type="text" name="username" class="form-control" required>
</div>
<div class="mb-3">
<label class="form-label">비밀번호</label>
<input type="password" name="password" class="form-control" required>
</div>
<!-- 자동 로그인 체크박스 -->
<div class="form-check mb-3">
<input class="form-check-input" type="checkbox" name="remember" id="remember" checked>
<label class="form-check-label" for="remember">로그인 상태 유지 (자동로그인)</label>
</div>
<button type="submit" class="btn btn-primary w-100">로그인</button>
</form>
</div>
</body>
</html>
